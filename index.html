<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseFit – Veg Fitness Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR: buttons use data-page so script.js knows which page to open -->
  <nav class="nav">
    <a class="logo" href="#">Pulse<b>Fit</b></a>
    <div class="nav-links">
      <button data-page="home" class="active">Home</button>
      <button data-page="workouts">Workouts</button>
      <button data-page="diet">Diet</button>
      <button data-page="bmi">BMI</button>
      <button data-page="tracker">Tracker</button>
    </div>
  </nav>

  <main>

    <!-- HOME -->
    <section id="home" class="page">
      <div class="hero-container">
        <div class="hero-text">
          <h1>Move more.<span>Eat green.</span></h1>
          <p>Track workouts, follow a veg diet, calculate BMI and monitor progress.</p>
          <button class="btn" data-page="workouts">Start workout</button>
        </div>
        <div class="hero-img">
          <img src="image.png" alt="Fitness illustration">
        </div>
      </div>

      <!-- Quick summary cards (filled by script.js) -->
      <div id="summary" class="grid"></div>
    </section>

    <!-- WORKOUTS -->
    <section id="workouts" class="page hidden">
      <h2>Weekly workout plan</h2>
      <div id="dayTabs" class="tabs"></div>

      <div class="card">
        <h3 id="workoutTitle"></h3>
        <div class="progress"><div id="workoutBar"></div></div>
        <p id="workoutCount" class="muted"></p>
        <div id="exerciseList"></div>
        <button id="restBtn" class="btn outline">Start 60s rest timer</button>
      </div>
    </section>

    <!-- DIET -->
    <section id="diet" class="page hidden">
      <h2>Veg diet plan</h2>
      <p class="muted">Tap a meal when you finish it.</p>
      <div id="mealList" class="grid"></div>

      <div class="card">
        <p id="dietTotal"></p>
        <div class="progress"><div id="dietBar"></div></div>
      </div>
    </section>

    <!-- BMI -->
    <section id="bmi" class="page hidden">
      <h2>BMI calculator</h2>
      <div class="card form">
        <input id="height" type="number" placeholder="Height (cm)">
        <input id="weight" type="number" placeholder="Weight (kg)">
        <button id="calcBMI" class="btn">Calculate BMI</button>

        <div id="bmiResult"></div>

        <!-- Colour scale with a marker that moves to your BMI -->
        <div class="bmi-scale"><span id="bmiMarker"></span></div>
        <div class="bmi-labels"><span>Under</span><span>Normal</span><span>Over</span><span>Obese</span></div>
      </div>
    </section>

    <!-- TRACKER -->
    <section id="tracker" class="page hidden">
      <h2>Progress tracker</h2>
      <div class="card form">
        <input id="tWeight" type="number" step="0.1" placeholder="Today's weight (kg)">
        <button id="saveTrack" class="btn">Save</button>
      </div>

      <div class="card">
        <div id="chart"></div>
        <div id="trackList"></div>
      </div>
    </section>

  </main>

  <!-- Small pop-up message -->
  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
